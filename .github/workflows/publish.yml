name: publish

# Publica @segmentados/ui al npm PÚBLICO (registry.npmjs.org) al crear un Release (o tag vX.Y.Z).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: '@segmentados'
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
        env:
          # Secret del repo: token de npmjs.com con permiso de publish sobre @segmentados (Automation token).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
